<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas CSS 1</title>
    <!--Internal css-->
    <style>
        /* setiap elemen 2 warnanya biru font size 50px*/
        h2 {
            color: blue;
            font-size: 50px;
        }
        /*untuk claas jududl warnanya merah font size 30px*/
        .judul {
            color:red;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <h1 class="judul"> <font color="red">Nama Saya Vito </font></h1>
    <!--semua elemen h2 warnanya biru-->
    <h2>Alamat saya tulungagung</h2>
    <h2>umur saya 22 tahun</h2>
    <p class="judul">Lorem ipsum dolor sit amet</p>
</body>
</html>
